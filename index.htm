<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --fuenteX: 20px;   /* movil */
  --fuenteG: 18px;   /* fuente var(--fuenteG) */
  --fuenteP: 14px;   /* fuente var(--fuenteP) */
  --colorP: #FFDD00; /* color principal var(--colorP) */
  --bg: #111;        /* bg principal var(--bg) */
  --bg2: #222;       /* bg second var(--bg2) */
  --bg3: #333;       /* bg second var(--bg3) */
}

#contenedor-botones {
  font-size:var(--fuenteG) !important;
  display: flex;
  align-items: stretch;
  gap: 6px;                     /* espacio entre botones */
  flex-shrink: 0;
  width: 100%;
}
/* ocultar checkbox real */
input.toggle {
  display: none !important;
}
/* botón moderno */
input.toggle + label {
  display: inline-flex !important;       /* fuerza display */
  justify-content: center;
  align-items: center;
  flex: 1;                /* los 4 se reparten todo el ancho */
  width: auto !important;
  height: 44px;
  border-radius: 12px;
  background-color: #a9234f !important; /* inicial */
  color: var(--colorP);
  cursor: pointer;
  position: relative;
  transition: background-color .2s;
}
/* hover apagado */
input.toggle + label:hover {
  color: white;
  background-color: #df4b46 !important;
}
/* hover activado */
input.toggle:checked + label:hover {
   color: white; 
  background-color: #25a143 !important;
}
/* estado ON */
input.toggle:checked + label {
  background-color: #385735 !important; /* activado */
}
/* bucle, al revés que los demás: CONTINUE (activado) en rojo, LOOP en verde */
#bucle + label {
  background-color: #385735 !important;
}
#bucle + label:hover {
  background-color: #25a143 !important;
}
#bucle:checked + label {
  background-color: #a9234f !important;
}
#bucle:checked + label:hover {
  background-color: #df4b46 !important;
}
/* textos dentro del botón */
input.toggle + label span {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity .2s;
}
input.toggle + label .on {
  opacity: 0;
}
input.toggle:checked + label .on {
  opacity: 1;
}
input.toggle:checked + label .off {
  opacity: 0;
}

body{
  font-size: 18px; /* por defecto del navegador 16px + 2 */
}
*{
   font-family: "Courier New", monospace;
}
div {
  scrollbar-color: var(--bg) var(--bg2);
  padding: 2px;
}
div,select,a{
  box-sizing: border-box;
  background-color: var(--bg);
  color:var(--colorP);
  border-color: var(--bg3);
}
select {
  display: inline-block;
  outline: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
}
a {
  text-decoration: none;
}
label{
  color: white;
}
label:not(.toggle-btn) {
  display: inline-flex;
  width: 60px;
  padding-left: 0px;
}
.selin{
	width: 336px;
}
html, body {
  margin: 0;
}
#contenedor{
  display:flex;
  width: 100%;
  height: 100vh;
  height: 100dvh;  /* sobreescribe si el navegador lo soporta */
  overflow: hidden;
  min-width: 320px;    /* añadir esto */  
}
#cont1{
	width: 350px;
	padding-top: 0;   /* TangoTry, arriba del todo */
	display: flex;    /* arriba los controles; abajo, fijas, las cajas de #abajo */
	flex-direction: column;
	overflow: hidden;
}
#controles{
	padding-top: 0;
	height: auto;     /* era 580px fijo */
	flex: 1 1 auto;
	min-height: 0;
	overflow-x: hidden;    /* sin scroll horizontal */
	overflow-y: auto;      /* en PC, si no cabe en la pantalla, se mueve con la rueda o el dedo (no se corta)... */
	scrollbar-width: none; /* ...pero sin barra de scroll (Firefox) */
}
#controles::-webkit-scrollbar{
	display: none;         /* sin barra de scroll (Chrome, Safari) */
}
#abajo{
	flex: none;
}
#cont2{
	flex: 1; /* ajuste responsive al resto del ancho disponible */
	position: relative;
  margin-top: 2px;
  display: flex;
  flex-direction: column;
}
/* barra del slider: misma altura que #contenedor-botones */
#barra-slider{
  height: 36px;
  flex-shrink: 0;
  background-color: var(--bg2);   /* casi negro */
  display: flex;
  justify-content: center;
  align-items: center;
}
#posicion{
  width: 100%;
  height: 32px;
  margin: 0;
  accent-color: var(--colorP);
  cursor: pointer;
  touch-action: none; /* arrastrar con el dedo no desplaza la página */
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}
/* slider: barra con las puntas redondas y botón redondo (Chrome/Safari y Firefox) */
#posicion::-webkit-slider-runnable-track{
  height: 8px;
  border-radius: 4px;
  background: #555;   /* se distingue del fondo gris oscuro */
}
#posicion::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -9px;   /* centrado en la barra: (8 - 26) / 2 */
  border: none;
  border-radius: 50%;
  background: var(--colorP);
}
#posicion::-moz-range-track{
  height: 8px;
  border-radius: 4px;
  background: #555;   /* se distingue del fondo gris oscuro */
}
#posicion::-moz-range-progress{
  height: 8px;
  border-radius: 4px;
  background: var(--colorP);
}
#posicion::-moz-range-thumb{
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 50%;
  background: var(--colorP);
}
#datosvideo,#salidaimprimir,#imprimir{
	font-size:var(--fuenteP);
	margin:auto;
	border:1px solid var(--bg3);
	width:332px;
}
#datosvideo{
  color: white;
  font-size: var(--fuenteG); /* como el resto del texto (los selectores) */
  line-height: 1.25;
  height: calc(4 * 1.25em + 6px); /* siempre 4 líneas (+ el padding 2+2 y el borde 1+1) */
  overflow: hidden;
}
/* las 4 líneas de datosvideo (carga): cada una en una sola línea; lo que no cabe se corta con "…" (entero,
   en el title: al pasar el ratón); vacía, ocupa su línea igual */
#datosvideo .dvlinea{
  display: block;
  height: 1.25em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#salidaimprimir,#imprimir{
  overflow: hidden;
  text-align: center;
}
#salidaimprimir{
	height: 26px;
}
#imprimir{
	margin-top: 6px;  /* separado de los enlaces */
	cursor:pointer;
}
#pie{
  font-size:var(--fuenteP);
  width:100%;
  text-align: center;
}
#leyenda{
	font-size:var(--fuenteP); 
	width:332px;   /* como #imprimir */
	margin:auto;
	height:70px;
	padding: 10px 10px 10px 30px;
	background-color: var(--bg2);  
}
#S4,#S3,#S2,#S1,#S0{
	width:242px;
	font-size:var(--fuenteG);
}
#busqueda-wrap{
  position: relative;
  width: 334px;
  margin-bottom: 2px;
}
#busqueda{
  width: 334px;
  font-size: var(--fuenteG);
  padding: 4px 26px 4px 28px; /* sitio para la lupa (izquierda) y la cruz (derecha) */
  border: 1px solid var(--bg3);
  outline: none;
  color: var(--colorP);
  background-color: var(--bg3);
  box-sizing: border-box;
}
/* la cruz que borra la búsqueda: se ve cuando hay algo escrito (buscar) */
#busqueda-clear{
  position: absolute;
  right: 4px;
  top: 50%;
  bottom: -8px;
  transform: translateY(-50%);
  display: none;
  align-items: center;
  cursor: pointer;
  color: #888;
  font-size: 26px;
  line-height: 1;
  user-select: none;
}
#titulo{
  font-size: 26px;
  font-weight: bold;
  text-align: center;
  line-height: 1;
  padding: 6px 0;     /* el mismo blanco encima y debajo */
}
#titulo a{
  font-size: var(--fuenteP); /* by KoKoTango, más pequeño */
  font-weight: normal;
}
#titulo a:hover{
  color: white;
}
#busqueda-lupa{
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  pointer-events: none; /* el clic llega al buscador */
  color: #888;
}
#S5,#S5>option{
  width:100%;
  font-size:calc(var(--fuenteP) + 2px);
  scrollbar-width: thin;
}
#S5::-webkit-scrollbar {
  display: none;
}
#L0,#L1,#L2,#L3,#L4{
	width: 90px;
}
#player2{
  width: 100%;
  height: 100%;
  flex: 1;
  min-height: 0; /* el video, arriba: ocupa el resto sobre el slider y los botones */
}

/* barra para volver del video a los selectores: solo en el móvil */
.barra-movil{
  display: none;
}

/* en un móvil (esMovil(): la clase movil en <html>), sin el selector position, aunque la pantalla sea ancha
   (en horizontal, o con "versión de escritorio") */
html.movil #D3 {
  display: none !important;
}

/* ===== RESPONSIVE MÓVIL ===== */
@media (max-width: 600px) {

  /* cada panel, una pantalla: el 1 (selectores) y, con scroll, el 2 (player); el scroll se para
     en cada uno */
  html {
    scroll-snap-type: y mandatory;
  }

  #contenedor {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #cont1 {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    scroll-snap-align: start;
    display: block;
    overflow: visible;
  }

  #abajo {
    display: none;
  }

  .barra-movil {
    display: block;
    flex-shrink: 0;
    padding: 8px;
    font-size: var(--fuenteG);
    text-align: center;
    color: var(--colorP);
    background-color: var(--bg3);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* botones del video un 10% más pequeños, el slider un 10% mayor */
  input.toggle + label {
    height: 40px;
  }

  #contenedor-botones {
    font-size: 16px !important;
    padding: 0;   /* sin los 2px de los div: el margen, solo el gap */
  }

  #barra-slider {
    height: 44px;
    width: 100%;
    padding: 0;
  }

  #posicion {
    height: 39px;
  }

  #controles {
    max-height: none;
    overflow: visible;
  }

  #cont2 {
    width: 100%;
    flex: none;
    height: 100vh;
    height: 100dvh;   /* el player (video, slider y botones): una pantalla entera */
    scroll-snap-align: start;
    margin-top: 0;
    gap: 6px;   /* barra, video, slider y botones: el mismo margen que entre los botones */
  }

  #player2 {
    display: block;
  }

  #busqueda-wrap, #busqueda {
    width: 100% !important;
  }

  .selin {
    width: 100% !important;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  label:not(.toggle-btn) {
    width: 100px !important;   /* "position" entero */
    white-space: nowrap;
    flex-shrink: 0;
    font-size: var(--fuenteX);   /* la de los selectores */
  }

  #S4,#S3,#S2,#S1,#S0 {
    box-sizing: border-box;
    width: auto !important;
    flex: 1;
    min-width: 0;
    font-size: var(--fuenteX);
  }

#S5, #S5 > option {
  width: 100% !important;
  font-size: calc(var(--fuenteX) + 2px);
}

  #D3, #D4 {   /* sin los selectores position y state */
    display: none !important;
  }

  #datosvideo, #imprimir, #salidaimprimir, #pie, #leyenda {
    display: none !important;
  }

}
</style>

<script>
// las parejas de datos.js (listaParejas), como Map: código → nombre
var parejasMapa;
// el nombre de una pareja: en listaParejas, completo ("manuela.rossi y juan.maliza": nombre.apellido, primero
// la mujer); en el selector, solo los nombres de pila (pila: "manuela y juan"); en datosvideo, entero, con
// espacios (completo: "manuela rossi y juan maliza")
const pila = s => String(s ?? '').split(/\s+/).map(w => w.split('.')[0]).join(' ');
const completo = s => String(s ?? '').replace(/\./g, ' ');
// state y group: en videos solo el código (#x); en el selector, en datosvideo y en la búsqueda, #x-texto con
// el texto de listaEstados / listaGrupos (state #0 → "#0-ready", group #0 → "#0-easy"). Un código sin texto
// sale tal cual
const textoCodigo = (c, lista) => { const m = /^#(\d+)$/.exec(String(c ?? '')); return m && lista[m[1]] !== undefined ? c + '-' + lista[m[1]] : String(c ?? ''); };
const textoEstado = c => textoCodigo(c, listaEstados);
const textoGrupo = c => textoCodigo(c, listaGrupos);
// los códigos de una lista: ["easy","hard"] → ["#0","#1"]
const codigos = lista => lista.map((t, i) => '#' + i);

// ¿es un móvil (o una tablet)? Mira el aparato, no el ancho de la ventana (el diseño de móvil, el @media
// max-width 600px, sí lo mira): un móvil en horizontal o con "versión de escritorio" también es móvil.
//  - navigator.userAgentData.mobile (Chrome y Edge en Android)
//  - el userAgent: Android, iPhone, iPad, iPod, Mobile...
//  - un iPad con iPadOS 13 o más, que dice ser un Mac pero tiene pantalla táctil
//  - si no, una pantalla táctil sin ratón: puntero grueso y sin hover
function esMovil(){
  const ua = navigator.userAgent || '';
  if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
  if (/Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(ua)) return true;
  if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
  return window.matchMedia('(pointer: coarse) and (hover: none)').matches;
}
// en un móvil, la clase movil en <html> (ya aquí, antes de pintar): el CSS html.movil quita lo que no va
if (esMovil()) document.documentElement.classList.add('movil');
</script>

<script>
// GLOBALES
// las columnas de cada registro de videos (datos.js)
const colId=0, colt1=1, colt2=2, colAutor=3, colEstado=4, colTema=5, colPosicion=6, colGrupo=7, colUrl=8;
const selVideo=5;   // el selector con la lista de clips (S5); S0..S4, los filtros
const nSel=['couple','subject','group','position','state','clips'];
let datos=[];       // las opciones de cada filtro: [parejas, tema, grupos, figuras, estados]
let textoBusqueda=[];  // por video, todo su texto en minúsculas, para buscar: se prepara una vez (inicio)
let section={start:0, end:0};  // el tramo del clip cargado, en segundos
let videoCargado;   // el índice en videos del que está cargado (carga)
let video, bucle, slider;      // el <video>, el botón LOOP y el slider (inicio)
const estrecha=window.matchMedia('(max-width: 600px)');  // pantalla estrecha: el diseño de móvil, como el @media
const $=id=>document.getElementById(id);

// los 5 filtros (S0..S4): la columna de videos que miran y cuándo casa la de un video con la opción elegida
// (casa(op) prepara la opción una vez y da la prueba para la celda de cada video). Los usan el filtro
// (cambio0) y el recuento ▹ de cada opción (creaSelector): siempre la misma regla
const FILTROS=[
  {col:colAutor,    casa:op=>{ const k=op.split(' ')[0]; return c=>c===k; }},              // couple: el código (AC), delante del nombre
  {col:colTema,     casa:op=>c=>tieneEtiqueta(c,op)},                                     // subject: la etiqueta entera (cambio no es cambioFrente)
  {col:colGrupo,    casa:op=>c=>c===op},                                                   // group: el código (#0)
  {col:colPosicion, casa:op=>c=>c.includes(op)},                                           // position: dentro de la cadena (a24 está en *a24-b13)
  {col:colEstado,   casa:op=>c=>c===op},                                                   // state: el código (#3)
];

// ¿está la etiqueta e entera en c ("barrida.sacada": sacada sí, saca no)? Sin trocear c: va en un bucle por video
function tieneEtiqueta(c,e){
  for (let i=c.indexOf(e); i>=0; i=c.indexOf(e,i+1))
    if ((i==0 || c[i-1]=='.') && (i+e.length==c.length || c[i+e.length]=='.')) return true;
  return false;
}

// group y state: todos los códigos de su lista (aunque ningún video lo tenga aún: sale con ▹0) y los que
// haya en videos
const valoresCodigo=(lista,col)=>[...new Set([...codigos(lista), ...videos.map(v=>v[col])])].filter(x=>x!=='').sort();

// las opciones de cada filtro (datos) y el texto de búsqueda de cada video (textoBusqueda)
function madeDatos(){
  const parejas=[...parejasMapa].map(([k,v])=>k+' '+pila(v)).sort();   // el selector, solo los nombres de pila
  const tema=[...etiquetas].sort();
  const figuras=[...new Set(videos.flatMap(v=>v[colPosicion].split('-').map(x=>x.trim()).filter(x=>x)))].sort();  // posiciones
  datos=[parejas, tema, valoresCodigo(listaGrupos,colGrupo), figuras, valoresCodigo(listaEstados,colEstado)];
  // buscar: en cualquier campo del video, en el nombre completo de la pareja y en el texto de state y group
  textoBusqueda=videos.map(v=>(v.join(' ')+' '+(parejasMapa.get(v[colAutor])||'')+' '+textoEstado(v[colEstado])+' '+textoGrupo(v[colGrupo])).toLowerCase());
}

// las opciones del filtro i (S0..S4): *todos* y cada valor con cuántos videos casan (▹); group y state, #x-texto
function creaSelector(i){
  const f=FILTROS[i];
  const nombre=i==2 ? textoGrupo : i==4 ? textoEstado : x=>x;
  const cuantos=op=>{ const es=f.casa(op); let n=0; for (const v of videos) if (es(v[f.col])) n++; return n; };
  $('S'+i).innerHTML='<option value="0" selected="selected">*todos*</option>'+datos[i].map((op,k)=>
    '<option value="'+(k+1)+'">'+nombre(op)+' ▹'+cuantos(op)+'</option>').join('');
  $('L'+i).innerHTML=nSel[i];
}

// la lista de clips (S5) con estos videos (índices en videos): "id subject"; el value, el índice + 1
function pintaClips(indices){
  $('S'+selVideo).innerHTML=indices.map(j=>'<option value="'+(j+1)+'">'+videos[j][colId]+' '+videos[j][colTema]+'</option>').join('');
}

// los 5 filtros a *todos*
function filtrosATodos(){
  for (let i=0;i<5;i++) $('S'+i).selectedIndex=0;
}

// la búsqueda, vacía y sin la cruz
function limpiaBusqueda(){
  $('busqueda').value='';
  $('busqueda-clear').style.display='none';
}

/* EVENTOS */
// la lista de clips (S5) según los filtros: los videos que casan con todos los elegidos (*todos*: cualquiera)
function cambio0(){
  $('salidaimprimir').innerHTML='';
  const activos=[];   // los filtros con una opción elegida: su columna y su prueba
  FILTROS.forEach((f,i)=>{ const k=$('S'+i).selectedIndex; if (k>0) activos.push({col:f.col, es:f.casa(datos[i][k-1])}); });
  const lista=[];
  videos.forEach((v,j)=>{ if (activos.every(f=>f.es(v[f.col]))) lista.push(j); });
  pintaClips(lista);
}

// la búsqueda: los clips con todas las palabras escritas (en textoBusqueda); los filtros, a *todos*
function buscar(){
  const palabras=$('busqueda').value.trim().toLowerCase().split(/\s+/).filter(p=>p);
  filtrosATodos();
  if (!palabras.length){ cambio0(); return; }   // sin búsqueda: la lista entera
  const lista=[];
  textoBusqueda.forEach((t,j)=>{ if (palabras.every(p=>t.includes(p))) lista.push(j); });
  pintaClips(lista);
}

// cambio de video por selector: change, o click en una opción (también en la ya elegida, que no da change)
function cambio(e){
  if (e.type=='click' && e.target.tagName!='OPTION') return; // el clic que abre la lista (iOS)
  if (this.value==='') return;
  if (this.value-1!=videoCargado) carga(this.value-1);
  if (estrecha.matches) $('cont2').scrollIntoView({behavior:'smooth'});  // en el móvil, a la pantalla del video
}

function cambioVoz(){ video.muted=!$('voz').checked; }
function cambioPausa(){ if ($('pausa').checked) video.pause(); else video.play(); }
function cambioVelo(){ video.playbackRate=$('velo').checked ? 0.25 : 1; }

// "click to print": copia al portapapeles las rutas de los clips de la lista (S5), ordenadas
function evtImprimir(){
  const rutas=[...$('S'+selVideo).options].map(o=>videos[o.value-1][colUrl]).sort();
  $('salidaimprimir').innerHTML='copiado portapapeles '+rutas.length+'<br/>';
  navigator.clipboard.writeText(rutas.join('\n'));
}

// carga el video b (índice en videos): su panel de datos, los botones como al empezar y el video
function carga(b){
  videoCargado=b;
  const v=videos[b];
  const fichero=v[colUrl].split('/').pop();
  const pareja=completo(parejasMapa.get(v[colAutor]));
  // 4 líneas, siempre (la caja no cambia de alto): id:pareja / su / gr st / fi po. Un campo vacío no
  // sale; si la línea se queda sin nada, queda en blanco. Lo largo se corta con "…" (CSS); entera, en el title
  const lleno=x=>String(x??'').trim()!=='';
  const campo=(n,x)=>lleno(x) ? n+':'+x : '';
  const juntos=(...c)=>c.filter(lleno).join(' ');
  $('datosvideo').innerHTML=[v[colId]+(lleno(pareja) ? ':'+pareja : ''),
     campo('su',v[colTema]),
     juntos(campo('gr',textoGrupo(v[colGrupo])),campo('st',textoEstado(v[colEstado]))),
     juntos(campo('fi',fichero),campo('po',v[colPosicion]))]
    .map(l=>'<span class="dvlinea" title="'+l.replace(/"/g,'&quot;')+'">'+l+'</span>').join('');
  bucle.checked=true;
  $('pausa').checked=false;
  $('velo').checked=false;
  $('voz').checked=false;
  // el tramo: en datos.js los tiempos son texto ("000", "999")
  section={start:Number(v[colt1])||0, end:Number(v[colt2])};
  cargaVideoLocal(v[colUrl]);
}

// cada 100 ms: al pasar del final del tramo, vuelta al principio (en LOOP), y el slider al día
function loopTimer(){
  if (bucle.checked && video.currentTime>section.end) video.currentTime=section.start;
  actualizaSlider();
}

// copia en memoria (blob) de los últimos videos: con el video entero ya
// descargado, mover el slider no espera a la red y es fluido. Mientras se
// descarga se ve el video directo; al terminar se cambia por la copia en el
// mismo punto. En file:// fetch falla: se queda el directo.
var cacheVideos=new Map(); // url -> blob url
var MAXCACHE=6;
function cacheVideo(vid){
  if (cacheVideos.has(vid)) return Promise.resolve(cacheVideos.get(vid));
  return fetch(vid).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.blob();
  }).then(function(bl){
    var u=URL.createObjectURL(bl);
    cacheVideos.set(vid,u);
    if (cacheVideos.size>MAXCACHE){ // fuera el más antiguo
      var k=cacheVideos.keys().next().value;
      URL.revokeObjectURL(cacheVideos.get(k));
      cacheVideos.delete(k);
    }
    return u;
  });
}

var videoActual=''; // url del video cargado (no la del blob)
function cargaVideoLocal(vid){
  videoActual=vid;
  video.src=cacheVideos.get(vid)||vid;
  if (!cacheVideos.has(vid)){
    cacheVideo(vid).then(function(u){
      if (videoActual!=vid) return; // ya se ha cambiado de video
      var t=video.currentTime, parado=video.paused;
      video.src=u;
      video.currentTime=t;
      video.playbackRate=$('velo').checked?0.25:1;
      if (!parado) video.play();
    }).catch(function(){});
  }
  video.controls=false; // sin los controles del navegador: los de la página
  video.currentTime=section.start;
  video.loop=true;
  video.muted=true;
  video.playbackRate=1;
  video.play();
}

// tramo del clip: [inicio, fin] en segundos, recortado a la duración real
function tramo(){
  var ini=section.start, fin=section.end;
  if (!(fin>ini) || fin>video.duration) fin=video.duration;
  return {ini: ini, fin: fin};
}

// mover el slider según la posición del video (salvo si se está arrastrando)
var arrastrando=false;
function actualizaSlider(){
  if (arrastrando) return;
  var t=tramo();
  if (!(t.fin>t.ini)) return;
  var v=(video.currentTime-t.ini)/(t.fin-t.ini)*1000;
  slider.value=Math.max(0,Math.min(1000,v));
}

// mover el video según el slider. Mientras se arrastra: un seek cada vez (el
// siguiente al terminar el anterior, con la última posición del dedo) y
// fastSeek (al fotograma clave más cercano) si el navegador lo tiene; al
// soltar, el punto exacto y sigue si no estaba parado
var seekPendiente=null, seguiaAntes=false;
function posSlider(){
  var t=tramo();
  if (!(t.fin>t.ini)) return null;
  return t.ini+slider.value/1000*(t.fin-t.ini);
}
function seek(p,rapido){
  if (rapido && video.fastSeek) video.fastSeek(p); else video.currentTime=p;
}
function cambioPosicion(){
  var p=posSlider();
  if (p==null) return;
  if (video.seeking){ seekPendiente=p; return; }
  seek(p,true);
}
function empiezaArrastre(){
  if (arrastrando) return;
  arrastrando=true;
  seguiaAntes=!video.paused;
  video.pause();
}
function terminaArrastre(){
  if (!arrastrando) return;
  arrastrando=false;
  seekPendiente=null;
  var p=posSlider();
  if (p!=null) video.currentTime=p;
  if (seguiaAntes && !$('pausa').checked) video.play();
}
function preparaSlider(){
  slider.addEventListener('pointerdown',empiezaArrastre);
  slider.addEventListener('touchstart',empiezaArrastre,{passive:true});
  slider.addEventListener('input',function(){ empiezaArrastre(); cambioPosicion(); });
  ['pointerup','pointercancel','touchend','touchcancel','change'].forEach(function(e){
    slider.addEventListener(e,terminaArrastre);
  });
  video.addEventListener('seeked',function(){
    if (seekPendiente==null || !arrastrando) return;
    var p=seekPendiente; seekPendiente=null;
    seek(p,true);
  });
}

// los selectores: la búsqueda arriba, y una fila por selector (label + select)

}

function b(n){

}

// el selector de parejas (S0): desplegado, el nombre completo de cada una (completo); cerrado, la elegida
// solo con los nombres de pila (pila). Un select muestra el mismo texto abierto y cerrado: se cambia al
// abrirlo (focus, mousedown, touchstart) y al elegir o salir (change, blur). El código va delante siempre
// (el filtro couple lo compara con split(' ')[0])
function nombresPareja(sel){
  const texto = (o, f) => { const k = o.text.split(' ')[0]; return parejasMapa.has(k) ? k + ' ' + f(parejasMapa.get(k)) : o.text; };
  const largos = () => { for (const o of sel.options) o.text = texto(o, completo); };
  const cortos = () => { for (const o of sel.options) o.text = texto(o, pila); };
  ['focus', 'mousedown', 'touchstart'].forEach(e => sel.addEventListener(e, largos));
  ['change', 'blur'].forEach(e => sel.addEventListener(e, cortos));
}

		const texto=await crypto.subtle.decrypt({name:'AES-GCM',iv:datos.slice(0,12)},clave,datos.slice(12));
		(0,eval)(new TextDecoder().decode(texto));   // var listaParejas, etiquetas, listaEstados, listaGrupos, videos
		parejasMapa=new Map(Object.entries(listaParejas));

}
