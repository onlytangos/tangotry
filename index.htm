input.toggle + label {
  display: inline-flex !important;       /* fuerza display */
  justify-content: center;
  align-items: center;
  flex: 1;                /* los 4 se reparten todo el ancho */

}
/* hover apagado */
input.toggle + label:hover {
  color: white;
  background-color: #df4b46 !important;
}
/* hover activado */
input.toggle:checked + label:hover {
   color: white; 
  background-color: #25a143 !important;
}
/* estado ON */
input.toggle:checked + label {
  background-color: #385735 !important; /* activado */
}
/* bucle, al revés que los demás: CONTINUE (activado) en rojo, LOOP en verde */
#bucle + label {
  background-color: #385735 !important;
}
#bucle + label:hover {
  background-color: #25a143 !important;
}
#bucle:checked + label {
  background-color: #a9234f !important;
}
#bucle:checked + label:hover {
  background-color: #df4b46 !important;
}
/* textos dentro del botón */
input.toggle + label span {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity .2s;
}
input.toggle + label .on {
  opacity: 0;
}
input.toggle:checked + label .on {
  opacity: 1;
}
input.toggle:checked + label .off {
  opacity: 0;
}

// copia en memoria (blob) de los últimos videos: con el video entero ya
// descargado, mover el slider no espera a la red y es fluido. Mientras se
// descarga se ve el video directo; al terminar se cambia por la copia en el
// mismo punto. En file:// fetch falla: se queda el directo.
var cacheVideos=new Map(); // url -> blob url
var MAXCACHE=6;
function cacheVideo(vid){
  if (cacheVideos.has(vid)) return Promise.resolve(cacheVideos.get(vid));
  return fetch(vid).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.blob();
  }).then(function(bl){
    var u=URL.createObjectURL(bl);
    cacheVideos.set(vid,u);
    if (cacheVideos.size>MAXCACHE){ // fuera el más antiguo
      var k=cacheVideos.keys().next().value;
      URL.revokeObjectURL(cacheVideos.get(k));
      cacheVideos.delete(k);
    }
    return u;
  });
}

var videoActual=''; // url del video cargado (no la del blob)
function cargaVideoLocal(vid,a,b){
  var x = document.getElementById("player2");  
  videoActual=vid;
  x.src=cacheVideos.get(vid)||vid;
  if (!cacheVideos.has(vid)){
    cacheVideo(vid).then(function(u){
      if (videoActual!=vid) return; // ya se ha cambiado de video
      var t=x.currentTime, parado=x.paused;
      x.src=u;
      x.currentTime=t;
      x.playbackRate=document.getElementById('velo').checked?0.25:1;
      if (!parado) x.play();
    }).catch(function(){});
  }
  x.controls=false; // sin los controles del navegador: los de la página
  x.currentTime=section.start;
  x.loop=true; 
  x.muted=true; 
  x.playbackRate=1;  
  x.play();
}

// tramo del clip: [inicio, fin] en segundos, recortado a la duración real
// (en datos.js los tiempos son texto, p.ej. "000" y "999")
function tramo(x){
  var ini=Number(section.start)||0;
  var fin=Number(section.end);
  if (!(fin>ini) || fin>x.duration) fin=x.duration;
  return {ini: ini, fin: fin};
}

// mover el slider según la posición del video (salvo si se está arrastrando)
var arrastrando=false;
function actualizaSlider(x){
  if (arrastrando) return;
  var t=tramo(x);
  if (!(t.fin>t.ini)) return;
  var v=(x.currentTime-t.ini)/(t.fin-t.ini)*1000;
  document.getElementById('posicion').value=Math.max(0,Math.min(1000,v));
}

// mover el video según el slider. Mientras se arrastra: un seek cada vez (el
// siguiente al terminar el anterior, con la última posición del dedo) y
// fastSeek (al fotograma clave más cercano) si el navegador lo tiene; al
// soltar, el punto exacto y sigue si no estaba parado
var seekPendiente=null, seguiaAntes=false;
function posSlider(x){
  var t=tramo(x);
  if (!(t.fin>t.ini)) return null;
  return t.ini+document.getElementById('posicion').value/1000*(t.fin-t.ini);
}
function seek(x,p,rapido){
  if (rapido && x.fastSeek) x.fastSeek(p); else x.currentTime=p;
}
function cambioPosicion(){
  if (local==undefined) return;
  var x=document.getElementById("player2");
  var p=posSlider(x);
  if (p==null) return;
  if (x.seeking){ seekPendiente=p; return; }
  seek(x,p,true);
}
function empiezaArrastre(){
  if (arrastrando || local==undefined) return;
  arrastrando=true;
  var x=document.getElementById("player2");
  seguiaAntes=!x.paused;
  x.pause();
}
function terminaArrastre(){
  if (!arrastrando) return;
  arrastrando=false;
  seekPendiente=null;
  if (local==undefined) return;
  var x=document.getElementById("player2");
  var p=posSlider(x);
  if (p!=null) x.currentTime=p;
  if (seguiaAntes && !document.getElementById('pausa').checked) x.play();
}
function preparaSlider(){
  var s=document.getElementById('posicion');
  s.addEventListener('pointerdown',empiezaArrastre);
  s.addEventListener('touchstart',empiezaArrastre,{passive:true});
  s.addEventListener('input',function(){ empiezaArrastre(); cambioPosicion(); });
  ['pointerup','pointercancel','touchend','touchcancel','change'].forEach(function(e){
    s.addEventListener(e,terminaArrastre);
  });
  document.getElementById('player2').addEventListener('seeked',function(){
    if (seekPendiente==null || !arrastrando) return;
    var p=seekPendiente; seekPendiente=null;
    seek(this,p,true);
  });
}

function buscar(){
  var q = document.getElementById('busqueda').value.trim().toLowerCase();
  if (q === '') {
    // sin búsqueda: restaurar todos los selectores al estado normal
    for (var j = 0; j < 5; j++) {
      document.getElementById('S'+j).selectedIndex = 0;
    }
    cambio0();
    return;
  }
  // buscar en todos los campos usados por los selectores:
  // colAutor(3), colTema(5), colGrupo(7), colPosicion(6), colEstado(4)
  var txt = '';
  for (var j = 0; j < videos.length; j++) {
    var v = videos[j];
    // construir texto de búsqueda con los campos de los selectores
    // pareja: buscar nombre completo via parejasMapa
    var nombrePareja = (parejasMapa.get(v[colAutor]) || '') + ' ' + (v[colAutor] || '');
    var camposBusqueda = (
      nombrePareja + ' ' +
      (v[colTema]     || '') + ' ' +
      (v[colGrupo]    || '') + ' ' +
      (v[colPosicion] || '') + ' ' +
      (v[colEstado]   || '')
    ).toLowerCase();
    var palabras = q.split(/\s+/).filter(function(p){ return p.length > 0; });
    var coincide = palabras.every(function(p){ return camposBusqueda.indexOf(p) !== -1; });
    if (coincide) {
      txt += '<option value="'+(j+1)+'">'+v[colId]+' '+v[colTema]+' '+v[colPosicion]+'</option>';
    }
  }
  var ele = document.getElementById('S'+selVideo);
  ele.innerHTML = txt;
  // resetear selectores de filtro para no interferir
  for (var j = 0; j < 5; j++) {
    document.getElementById('S'+j).selectedIndex = 0;
  }
}
